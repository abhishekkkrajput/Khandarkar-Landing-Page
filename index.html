<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Khandarkar - The Premium Matrimonial Platform for Kashmiri Muslims. Find your perfect match with privacy, dignity, and tradition. Verified profiles, blessed unions.">
    <meta name="keywords"
        content="Kashmiri Matrimony, Nikah, Muslim Marriage, Kashmir, Khandarkar, Rishta, Matchmaking">
    <meta property="og:title" content="Khandarkar | Sacred Kashmiri Nikah">
    <meta property="og:description"
        content="Begin your journey to a blessed union. The most trusted and premium matrimonial service in Kashmir.">
    <meta property="og:image" content="/images/preview-card.png">
    <title>KHANDARKAR | Sacred Kashmiri Nikah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: '#D4AF37',
                        'gold-light': '#F5E0A3',
                        brand: '#B6337D',
                        'brand-dark': '#8E1F5D',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Montserrat', 'sans-serif'],
                        cinzel: ['Cinzel', 'serif'],
                    },
                    boxShadow: {
                        'premium': '0 20px 60px -15px rgba(212, 175, 55, 0.2)',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;500;600;700&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            scroll-behavior: smooth;
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #F5E0A3 50%, #D4AF37 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .border-gold {
            border-image: linear-gradient(135deg, #D4AF37, #F5E0A3, #D4AF37) 1;
        }

        .glass-dark {
            background: rgba(182, 51, 125, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .glass-light {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        @keyframes mobile-live-effect {
            0% {
                transform: scale(1) rotate(0deg);
            }

            25% {
                transform: scale(1.005) rotate(0.5deg);
            }

            50% {
                transform: scale(1.01) rotate(0deg);
            }

            75% {
                transform: scale(1.005) rotate(-0.5deg);
            }

            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        .animate-mobile-live {
            animation: mobile-live-effect 4s ease-in-out infinite;
        }

        @keyframes fade-slide-up {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-slide-up {
            animation: fade-slide-up 0.5s ease-out forwards;
        }
    </style>
</head>

<body class="bg-[#F4F4F4] text-[#B6337D] selection:bg-[#D4AF37] selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
